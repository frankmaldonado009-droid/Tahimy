<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ramo de flores amarillas</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(to top, #f1f8e9, #fffde7);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .ramo {
    position: relative;
    width: 300px;
    height: 400px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .flor {
    position: absolute;
    bottom: 60px;
    width: 80px;
    height: 80px;
    transform: scale(0);
    opacity: 0;
    animation: aparecer 1s forwards;
  }

  .tallo {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 6px;
    height: 120px;
    background: #2e7d32;
    border-radius: 6px;
    transform: translateX(-50%);
    z-index: -1;
  }

  .centro {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    background: #6d4c41;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .petalo {
    position: absolute;
    width: 35px;
    height: 55px;
    background: radial-gradient(circle at 40% 20%, #fff9c4, #fbc02d);
    border-radius: 50% 50% 40% 40%;
    top: 50%;
    left: 50%;
    transform-origin: bottom center;
  }

  @keyframes aparecer {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    100% { transform: scale(1) rotate(360deg); opacity: 1; }
  }
</style>
</head>
<body>

<div class="ramo" id="ramo"></div>

<script>
function crearFlor(x, delay) {
  const flor = document.createElement("div");
  flor.classList.add("flor");
  flor.style.left = x + "px";
  flor.style.animationDelay = delay + "s";

  // tallo
  const tallo = document.createElement("div");
  tallo.classList.add("tallo");
  flor.appendChild(tallo);

  // centro
  const centro = document.createElement("div");
  centro.classList.add("centro");
  flor.appendChild(centro);

  // pétalos
  for (let i = 0; i < 8; i++) {
    const petalo = document.createElement("div");
    petalo.classList.add("petalo");
    petalo.style.transform =
      `translate(-50%, -100%) rotate(${i * 45}deg)`;
    flor.appendChild(petalo);
  }

  document.getElementById("ramo").appendChild(flor);
}

let posiciones = [-100, -60, -20, 20, 60, 100];
posiciones.forEach((x, i) => {
  crearFlor(x, i * 0.8); // cada flor aparece con retraso
});
</script>

</body>
</html>
